<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstonishMe - Daily Workout Generator & Interval Timer</title>
    <meta name="description" content="Generate daily functional strength and conditioning workouts and train with a customizable interval timer.">
    <meta name="keywords" content="workout generator, daily workout, strength and conditioning, WOD generator, WOD, workout of day, interval timer, tabata timer, strength training">
    <!-- Tailwind CSS matching Material 3 Dark theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#121212',
                        brandCard: '#1E1E1E',
                        brandSurfaceVariant: '#252528',
                        brandPrimary: '#BB86FC',
                        brandSecondary: '#03DAC6',
                    }
                }
            }
        }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2941399131306867"
     crossorigin="anonymous"></script>
</head>
<body class="bg-brandDark text-gray-100 min-h-screen flex flex-col items-center p-4">

    <!-- Top Banner Ad Placeholder -->
    <div class="w-full max-w-2xl my-2 p-2 bg-neutral-900 border border-neutral-800 rounded-lg text-center text-xs text-neutral-500">
        <span>Advertisement</span>
        <div id="ad-top-slot" class="min-h-[60px] flex items-center justify-center">
            <!-- Ad unit code will go here -->
        </div>
    </div>

    <!-- Main App Container -->
    <main class="w-full max-w-2xl bg-brandCard rounded-2xl shadow-2xl p-6 border border-neutral-800 space-y-6">
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-brandPrimary">AstonishMe</h1>
            <p class="text-gray-400 text-sm mt-1">Daily Functional Strength & Conditioning</p>
        </header>

        <!-- ================= WORKOUT GENERATOR SECTION ================= -->
        <section id="section-generator" class="space-y-4">
            <div class="text-center">
                <button id="btn-generate" onclick="generateWorkout()" class="w-full py-3.5 px-6 bg-brandPrimary hover:bg-purple-400 text-black font-bold text-lg rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <span>⚡</span> <span>Generate S&C Workout</span>
                </button>
            </div>

            <!-- Placeholder (Before generating) -->
            <div id="workout-placeholder" class="bg-neutral-900/60 rounded-xl p-10 border border-neutral-800 text-center">
                <p class="text-gray-500 font-bold text-base">Your workout will appear here</p>
            </div>

            <!-- Workout Results Card -->
            <div id="workout-card" class="hidden bg-neutral-900/90 rounded-xl p-5 border border-neutral-700 space-y-5">
                <div class="border-b border-neutral-700 pb-3 flex justify-end items-center">
                    <span class="text-xs bg-purple-900/60 text-purple-200 px-2.5 py-1 rounded-full font-medium">Daily Routine</span>
                </div>

                <!-- Warm Up -->
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-teal-400 mb-1">Warm-Up</h3>
                    <p id="workout-warmup" class="text-gray-300 text-sm leading-relaxed"></p>
                </div>

                <!-- Strength Block -->
                <div class="space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-teal-400">Part A: Strength Block</h3>
                    <div id="strength-exercises" class="space-y-2"></div>
                </div>

                <!-- Conditioning Block -->
                <div class="space-y-3">
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-teal-400">Part B: Conditioning Block</h3>
                        <p id="conditioning-format" class="text-xs text-yellow-400 font-semibold mt-0.5"></p>
                    </div>
                    <div id="conditioning-exercises" class="space-y-2"></div>
                </div>
            </div>
        </section>

        <!-- Divider -->
        <hr class="border-neutral-800" />

        <!-- ================= TIMER SECTION (STOPWATCH / COUNTDOWN) ================= -->
        <section id="section-timer" class="bg-brandSurfaceVariant rounded-xl p-5 border border-neutral-700 space-y-4">
            <!-- Mode Tabs (Stopwatch vs Countdown) -->
            <div class="flex border-b border-neutral-700">
                <button id="tab-stopwatch" onclick="setTimerMode('stopwatch')" class="flex-1 pb-2.5 text-center font-bold text-sm text-brandPrimary border-b-2 border-brandPrimary transition">
                    Stopwatch
                </button>
                <button id="tab-countdown" onclick="setTimerMode('countdown')" class="flex-1 pb-2.5 text-center font-bold text-sm text-gray-400 hover:text-gray-200 transition">
                    Countdown
                </button>
            </div>

            <!-- Time Display / Input Area -->
            <div class="min-h-[90px] flex items-center justify-center">
                <!-- Running / Stopwatch Display (MM:SS) -->
                <div id="timer-display-box" class="text-5xl md:text-6xl font-black font-mono tracking-tight text-white">
                    00:00
                </div>

                <!-- Countdown Input Form (Visible only when in Countdown mode and NOT running) -->
                <div id="countdown-input-box" class="hidden flex items-center justify-center gap-2">
                    <div class="flex flex-col items-center">
                        <label class="text-[10px] uppercase font-bold tracking-wider text-gray-400 mb-1">Min</label>
                        <input id="input-minutes" type="number" min="0" max="999" value="1" oninput="updateCountdownFromInputs()"
                            class="w-20 bg-neutral-900 border border-neutral-600 rounded-lg p-2.5 text-center text-white font-mono text-xl font-bold focus:outline-none focus:border-brandPrimary">
                    </div>
                    <span class="text-3xl font-bold text-gray-300 mt-4">:</span>
                    <div class="flex flex-col items-center">
                        <label class="text-[10px] uppercase font-bold tracking-wider text-gray-400 mb-1">Sec</label>
                        <input id="input-seconds" type="number" min="0" max="59" value="00" oninput="updateCountdownFromInputs()"
                            class="w-20 bg-neutral-900 border border-neutral-600 rounded-lg p-2.5 text-center text-white font-mono text-xl font-bold focus:outline-none focus:border-brandPrimary">
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="flex gap-4">
                <button id="btn-toggle" onclick="toggleTimer()" 
                    class="flex-1 py-3 px-4 bg-brandPrimary hover:bg-purple-400 text-black font-bold rounded-xl transition shadow-md">
                    Start
                </button>
                <button onclick="resetTimer()" 
                    class="flex-1 py-3 px-4 bg-brandSecondary hover:bg-teal-300 text-black font-bold rounded-xl transition shadow-md">
                    Reset
                </button>
            </div>
        </section>
    </main>

    <!-- Bottom Banner Ad Placeholder -->
    <div class="w-full max-w-2xl my-4 p-2 bg-neutral-900 border border-neutral-800 rounded-lg text-center text-xs text-neutral-500">
        <span>Advertisement</span>
        <div id="ad-bottom-slot" class="min-h-[60px] flex items-center justify-center">
            <!-- Ad unit code will go here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full max-w-2xl text-center pt-2 pb-6 text-xs text-neutral-500">
    <p>&copy; 2026 AstonishMe. All rights reserved. | <a href="/about" class="underline hover:text-gray-400">About</a> | <a href="/privacy" class="underline hover:text-gray-400">Privacy Policy</a></p>
    </footer>

    <!-- Application Script -->
    <script>
        // Exercise lists matching Android app
        const strengthList = [
            "Back Squat", "Deadlift", "Bench Press", "Barbell Row", "Clean and Jerk", 
            "Romanian Deadlift", "Overhead Squat", "Snatch", "Overhead Press", "Power Clean", 
            "Power Snatch", "Barbell Lunge", "Front Squat", "Push Press", "Rack Pull", 
            "Weighted Pull Ups", "Weighted Chin Ups"
        ];

        const conditioningList = [
            { name: "Run", scheme: "400m Run (High Intensity)" },
            { name: "Rower", scheme: "500m Row (High Intensity)" },
            { name: "Burpees", scheme: "15 Reps" },
            { name: "Push Ups", scheme: "15-20 Reps" },
            { name: "Pull Ups", scheme: "8-12 Reps" },
            { name: "Plank", scheme: "Hold for 45-60 seconds" },
            { name: "Dumbbell Thrusters", scheme: "15 Reps" },
            { name: "Dumbbell Lunges", scheme: "20 Alt. Reps" },
            { name: "Kettlebell Swing", scheme: "20 Reps" },
            { name: "Dips", scheme: "15-20 Reps" },
            { name: "Russian Twist", scheme: "20 Reps" },
            { name: "Hanging Leg Raise", scheme: "12-15 Reps" },
            { name: "Assault Bike", scheme: "Calorie sprint" },
            { name: "Jump Squats", scheme: "20-25 Reps" },
            { name: "Seated Box Jump", scheme: "8 high jumps" },
            { name: "Sit Up", scheme: "20-25 Reps" },
            { name: "Med Ball Slams", scheme: "15 slam reps" },
            { name: "Toes to Bar", scheme: "8-12 Reps" }
        ];

        const conditioningFormats = [
            "AMRAP 15 Minutes (As Many Rounds As Possible)",
            "4 Rounds for Time (Complete as fast as possible with good form)",
            "EMOM 12 Minutes (Every Minute on the Minute - perform exercise 1 on min 1, exercise 2 on min 2, etc.)"
        ];

        function shuffle(arr) {
            return [...arr].sort(() => 0.5 - Math.random());
        }

        function generateWorkout() {
            const shuffledStrength = shuffle(strengthList);
            const shuffledConditioning = shuffle(conditioningList);
            const format = conditioningFormats[Math.floor(Math.random() * conditioningFormats.length)];

            document.getElementById('workout-warmup').innerText = "5-10 Minutes of dynamic stretching: Arm circles, leg swings, bodyweight squats, and jumping jacks.";

            // Part A
            const s1 = shuffledStrength[0];
            const s2 = shuffledStrength[1];
            const s1Scheme = ["Deadlift", "Clean and Jerk", "Snatch"].includes(s1) ? "3 sets x 5 reps (Heavy)" : "4 sets x 8 reps (Moderate-Heavy)";
            const s2Scheme = ["Deadlift", "Clean and Jerk", "Snatch"].includes(s2) ? "3 sets x 5 reps (Heavy)" : "4 sets x 8-10 reps (Moderate-Heavy)";

            document.getElementById('strength-exercises').innerHTML = `
                <div class="bg-neutral-800 p-3 rounded-lg border border-neutral-700 flex justify-between items-center">
                    <span class="font-bold text-white text-sm">${s1}</span>
                    <span class="text-xs bg-purple-900/60 text-purple-200 px-2 py-1 rounded font-bold">${s1Scheme}</span>
                </div>
                <div class="bg-neutral-800 p-3 rounded-lg border border-neutral-700 flex justify-between items-center">
                    <span class="font-bold text-white text-sm">${s2}</span>
                    <span class="text-xs bg-purple-900/60 text-purple-200 px-2 py-1 rounded font-bold">${s2Scheme}</span>
                </div>
            `;

            // Part B
            document.getElementById('conditioning-format').innerText = format;
            const cExercises = shuffledConditioning.slice(0, 3);
            document.getElementById('conditioning-exercises').innerHTML = cExercises.map(ex => `
                <div class="bg-neutral-800 p-3 rounded-lg border border-neutral-700 flex justify-between items-center">
                    <span class="text-white font-bold text-sm">${ex.name}</span>
                    <span class="text-xs bg-teal-900/60 text-teal-300 px-2 py-1 rounded font-bold">${ex.scheme}</span>
                </div>
            `).join('');

            document.getElementById('workout-placeholder').classList.add('hidden');
            document.getElementById('workout-card').classList.remove('hidden');
            document.getElementById('btn-generate').innerHTML = `<span>🔄</span> <span>Regenerate S&C Workout</span>`;
        }

        // ================= STOPWATCH / COUNTDOWN TIMER LOGIC =================
        let isStopwatchMode = true;
        let isRunning = false;
        let elapsedMs = 0;
        let countdownRemainingMs = 60000; // 1 min default
        let timerInterval = null;
        let lastTime = 0;

        function formatTime(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const seconds = (totalSeconds % 60).toString().padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function updateCountdownFromInputs() {
            const min = parseInt(document.getElementById('input-minutes').value) || 0;
            const sec = parseInt(document.getElementById('input-seconds').value) || 0;
            countdownRemainingMs = (min * 60 + sec) * 1000;
        }

        function setTimerMode(mode) {
            pauseTimer();
            isStopwatchMode = (mode === 'stopwatch');

            const tabStopwatch = document.getElementById('tab-stopwatch');
            const tabCountdown = document.getElementById('tab-countdown');

            if (isStopwatchMode) {
                tabStopwatch.className = "flex-1 pb-2.5 text-center font-bold text-sm text-brandPrimary border-b-2 border-brandPrimary transition";
                tabCountdown.className = "flex-1 pb-2.5 text-center font-bold text-sm text-gray-400 hover:text-gray-200 transition";
            } else {
                tabCountdown.className = "flex-1 pb-2.5 text-center font-bold text-sm text-brandPrimary border-b-2 border-brandPrimary transition";
                tabStopwatch.className = "flex-1 pb-2.5 text-center font-bold text-sm text-gray-400 hover:text-gray-200 transition";
                updateCountdownFromInputs();
            }

            renderTimerUI();
        }

        function renderTimerUI() {
            const displayBox = document.getElementById('timer-display-box');
            const inputBox = document.getElementById('countdown-input-box');
            const btnToggle = document.getElementById('btn-toggle');

            if (!isStopwatchMode && !isRunning) {
                // Show inputs when idle in countdown mode
                displayBox.classList.add('hidden');
                inputBox.classList.remove('hidden');
            } else {
                inputBox.classList.add('hidden');
                displayBox.classList.remove('hidden');
                const timeMs = isStopwatchMode ? elapsedMs : countdownRemainingMs;
                displayBox.innerText = formatTime(timeMs);
            }

            // Button styling
            if (isRunning) {
                btnToggle.innerText = "Stop";
                btnToggle.className = "flex-1 py-3 px-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition shadow-md";
            } else {
                btnToggle.innerText = "Start";
                btnToggle.className = "flex-1 py-3 px-4 bg-brandPrimary hover:bg-purple-400 text-black font-bold rounded-xl transition shadow-md";
            }
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!isStopwatchMode && countdownRemainingMs <= 0) {
                updateCountdownFromInputs();
            }
            isRunning = true;
            lastTime = Date.now();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = now - lastTime;
                lastTime = now;

                if (isStopwatchMode) {
                    elapsedMs += diff;
                } else {
                    if (countdownRemainingMs > diff) {
                        countdownRemainingMs -= diff;
                    } else {
                        countdownRemainingMs = 0;
                        pauseTimer();
                    }
                }
                renderTimerUI();
            }, 100);

            renderTimerUI();
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            renderTimerUI();
        }

        function resetTimer() {
            pauseTimer();
            if (isStopwatchMode) {
                elapsedMs = 0;
            } else {
                updateCountdownFromInputs();
            }
            renderTimerUI();
        }

        // Initialize display
        renderTimerUI();
    </script>
</body>
</html>
